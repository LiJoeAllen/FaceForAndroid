[versions]
agp = "9.4.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.04.01"
miuix = "0.9.1"
camerax = "1.4.2"
seetaFace = "6.0.0-alpha02"

# face/FaceSDKLib.gradle 的依赖（FaceAISDK Demo 库，版本与上游对齐）
faceaiSdk = "2026.09.20"
uvcAndroid = "1.0.13"
localbroadcastmanager = "1.1.0"
recyclerAdapterHelper = "4.1.1"
gson = "2.13.2"
mmkv = "1.3.14"
easypermissions = "3.0.0"
lottie = "6.5.2"
glide = "4.16.0"
appcompat = "1.6.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
fileOperator = "3.9.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }

# face/FaceSDKLib.gradle 专用（注意 name 保留上游大小写）
faceai-android = { group = "io.github.faceaisdk", name = "Android", version.ref = "faceaiSdk" }
uvc-android = { group = "com.herohan", name = "UVCAndroid", version.ref = "uvcAndroid" }
androidx-localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "localbroadcastmanager" }
base-recyclerview-adapter-helper4 = { group = "io.github.cymchad", name = "BaseRecyclerViewAdapterHelper4", version.ref = "recyclerAdapterHelper" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
mmkv = { group = "com.tencent", name = "mmkv", version.ref = "mmkv" }
easypermissions = { group = "pub.devrel", name = "easypermissions", version.ref = "easypermissions" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# version catalog 不支持 @aar artifact type，声明处需补 transitive=false + artifact { type = "aar" }
javakam-file-core = { group = "com.github.javakam", name = "file.core", version.ref = "fileOperator" }
javakam-file-selector = { group = "com.github.javakam", name = "file.selector", version.ref = "fileOperator" }
javakam-file-compressor = { group = "com.github.javakam", name = "file.compressor", version.ref = "fileOperator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

