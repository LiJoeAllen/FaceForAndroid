# Pinned to 17 on purpose: AGP's JdkImageTransform (jlink on
# core-for-system-modules) fails when the Gradle daemon runs on JDK 25
# (GraalVM). A locally installed JDK 17 is auto-detected; regenerate pinned
# download URLs with `./gradlew updateDaemonJvm --jvm-version=17` if needed.
toolchainVersion=17
