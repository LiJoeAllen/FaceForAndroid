// FaceAISDK 官方 Demo 模块的 AGP 9 适配版构建脚本。
// 不改动 submodule 内的文件（保持上游原样），通过 settings.gradle.kts 的
// buildFileName 指向本文件。相对上游原版的变化：
//   * 去掉 kotlin-android / KSP 插件（AGP 9 内置 Kotlin，Demo 未用 Glide 生成 API）
//   * 去掉库模块的 targetSdk（AGP 9 已移除）
//   * 去掉库模块的 ndk abiFilters（由 app 统一控制 ABI）
//   * 依赖坐标改由 gradle/libs.versions.toml 统一管理（版本与上游一致）
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.faceAI.demo'
    compileSdk 36
    defaultConfig {
        minSdk 21

        // 传递给接入方 App：仅保留 FaceSDKLib 的类/成员名，
        // 不会关闭接入方自身的 R8 压缩和混淆。
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            // 启用 R8 的无用代码删除和字节码优化。
            // aar-optimize-rules.pro 中的 -dontobfuscate 保证不混淆。
            minifyEnabled true
            //noinspection NotShrinkingResources
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'aar-optimize-rules.pro'
        }
    }

    //不压缩SDK中的模型
    androidResources {
        noCompress "tflite"
        noCompress "bin"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}


dependencies {

    //Face SDK API Demo(Android)：https://github.com/FaceAISDK/FaceAISDK_Android
    api libs.faceai.android

    //Library and sample to access UVC camera: https://github.com/shiyinghan/UVCAndroid
    implementation libs.uvc.android //For Custom Android device use UVC camera

    implementation libs.androidx.localbroadcastmanager
    implementation libs.base.recyclerview.adapter.helper4
    implementation libs.gson
    implementation libs.mmkv
    api libs.easypermissions   //permission
    implementation libs.lottie
    implementation libs.glide
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview

    //image File Select: https://github.com/javakam/FileOperator
    //version catalog 不收录 artifact type；@aar 等价于 artifact-only（关闭传递依赖），
    //故两处都要补，否则会拖进 file.compressor 元数据里坏掉的 FileOperator:library_core
    implementation(libs.javakam.file.core) { transitive = false; artifact { type = 'aar' } }       //Core library required
    implementation(libs.javakam.file.selector) { transitive = false; artifact { type = 'aar' } }   //File selector
    implementation(libs.javakam.file.compressor) { transitive = false; artifact { type = 'aar' } } //Compress

}
